<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- iOS fonts are proprietary: Arial-metric Liberation stands in for Helvetica, Times and Courier,
     with the iPhone's line heights (container-setup.sh). -->
<fontconfig>
  <dir>/tmp/fonts-ios</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <dir>/usr/share/fonts/opentype/noto</dir>
  <cachedir>/tmp/fontconfig-ios</cachedir>
  <match target="scan">
    <test name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="append"><string>Helvetica</string><string>Helvetica Neue</string><string>Arial</string><string>-apple-system</string><string>system-ui</string><string>BlinkMacSystemFont</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Liberation Serif</string></test>
    <edit name="family" mode="append"><string>Times</string><string>Times New Roman</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="append"><string>Courier</string><string>Courier New</string><string>Menlo</string></edit>
  </match>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
