<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Android font set: Roboto + Noto Serif + a 0.6em monospace (device calibration: serif and
     monospace are not Roboto). Android's aliases (fonts.xml) are advertised on the real files
     so Chromium matches them by name. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/roboto</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <dir>/usr/share/fonts/opentype/noto</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <cachedir>/tmp/fontconfig-android</cachedir>
  <match target="scan">
    <test name="family"><string>Roboto</string></test>
    <edit name="family" mode="append"><string>Arial</string><string>Helvetica</string><string>Tahoma</string><string>Verdana</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Serif</string></test>
    <edit name="family" mode="append"><string>Times</string><string>Times New Roman</string><string>Georgia</string><string>Palatino</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="append"><string>Courier</string><string>Courier New</string><string>Monaco</string></edit>
  </match>
  <alias><family>sans-serif</family><prefer><family>Roboto</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
  <match target="font"><edit name="hinting" mode="assign"><bool>false</bool></edit><edit name="hintstyle" mode="assign"><const>hintnone</const></edit></match>
</fontconfig>
