<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Android font set: Roboto + Noto. Android's aliases (fonts.xml) are advertised on the real
     files so Chromium matches them by name; flutter_inappwebview maps serif to sans-serif. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/roboto</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <dir>/usr/share/fonts/opentype/noto</dir>
  <cachedir>/tmp/fontconfig-android</cachedir>
  <match target="scan">
    <test name="family"><string>Roboto</string></test>
    <edit name="family" mode="append"><string>Arial</string><string>Helvetica</string><string>Tahoma</string><string>Verdana</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Serif</string></test>
    <edit name="family" mode="append"><string>Times</string><string>Times New Roman</string><string>Georgia</string><string>Palatino</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Mono</string></test>
    <edit name="family" mode="append"><string>Courier</string><string>Courier New</string><string>Monaco</string></edit>
  </match>
  <alias><family>sans-serif</family><prefer><family>Roboto</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Noto Mono</family></prefer></alias>
</fontconfig>
